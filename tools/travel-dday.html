<main><div class="meta">여행 도구 · 2026-11-25</div><h1>여행 D-day 계산기 — 출발일·여행지·준비 타임라인 자동 표시</h1><p>출발일을 입력하면 <strong>지금 해야 할 준비</strong>를 타임라인으로 보여줍니다. 여행지도 함께 입력하면 해외여행 필수 서류 체크가 추가됩니다.</p>
<div id="dd" style="background:#f8fafc;border:1px solid #e6e2d8;border-radius:14px;padding:22px;margin:16px 0">
<style>
#dd input[type=date],#dd select{padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff}
#dd .dd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
#dd .dd-big{font-size:56px;font-weight:800;color:#0f766e;text-align:center;line-height:1.1}
#dd .dd-sub{font-size:12px;color:#888;text-align:center;margin-bottom:14px}
#dd .tl-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:13.5px}
#dd .tl-item:last-child{border-bottom:none}
#dd .tl-d{min-width:44px;font-weight:800;color:#0f766e;font-size:12.5px}
#dd .tl-t{font-weight:700;min-width:90px;font-size:13px}
#dd .tl-done{color:#16a34a}
#dd .tl-now{background:#f0fdfa;border-radius:8px;padding:2px 6px}
#dd .tl-wait{color:#9ca3af}
#dd .tip{font-size:12px;color:#888;margin-top:12px;line-height:1.6}
@media(max-width:560px){#dd .dd-big{font-size:42px}}
</style>
<div class="dd-grid">
<label style="font-size:12px;font-weight:700;color:#4b5563">여행 출발일<input type="date" id="dd-date"></label>
<label style="font-size:12px;font-weight:700;color:#4b5563">여행지<select id="dd-dest"><option value="kr">국내</option><option value="jp">일본</option><option value="eu">유럽</option><option value="sea">동남아</option><option value="etc">기타 해외</option></select></label>
</div>
<div id="dd-out"></div>
</div>

<script>
const TL=[
 {d:60,t:'여권·비자 확인',x:'해외여행 시 여권 잔여 6개월 이상, 비자 필요 국가 확인'},
 {d:45,t:'여행자 보험',x:'해외여행 보험 가입 — 의료비·지연·분실 보장'},
 {d:30,t:'항공권·숙소 확정',x:'항공권이 가장 저렴한 시기 — 2~3개월 전이 정석'},
 {d:21,t:'투어·티켓 예약',x:'디즈니·유니버설·테마파크·인기 관광지 온라인 예매'},
 {d:14,t:'예방접종·약 챙기기',x:'해외여행 시 A형 간염·장티푸스 등 예방접종 권장'},
 {d:7,t:'eSIM·유심 준비',x:'공항 도착 즉시 데이터 사용 — 미리 구매'},
 {d:7,t:'환전·카드 준비',x:'소액 현지화폐 + 해외결제 카드'},
 {d:5,t:'짐싸기 시작',x:'[짐싸기 체크리스트](/familytrip/checklists/kids-packing-list.html) 참고'},
 {d:3,t:'날씨 확인·우비 준비',x:'[실시간 날씨](/familytrip/tools/travel-weather.html)에서 목적지 날씨 확인'},
 {d:1,t:'최종 점검',x:'여권·항공권·숙소 확인서·약·충전기·보조배터리'},
 {d:0,t:'출발!',x:'공항 도착 3시간 전, 수하물 무게 확인'}
];
function render(){
 const dv=document.getElementById('dd-date').value;
 const dest=document.getElementById('dd-dest').value;
 const out=document.getElementById('dd-out');
 if(!dv){out.innerHTML='';return}
 const today=new Date();today.setHours(0,0,0,0);
 const dep=new Date(dv+'T00:00:00');
 const diff=Math.round((dep-today)/864e5);
 let head='';
 if(diff<0)head='<div class="dd-big" style="color:#dc2626">여행 완료</div><div class="dd-sub">D+'+Math.abs(diff)+'일 경과</div>';
 else if(diff===0)head='<div class="dd-big">D-DAY</div><div class="dd-sub">오늘 출발합니다!</div>';
 else head='<div class="dd-big">D-'+diff+'</div><div class="dd-sub">'+dep.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})+' 출발까지</div>';
 const KR_EXTRA=dest!=='kr'?['<div class="tl-item"><span class="tl-d">D-60</span><span class="tl-t">입국 서류 준비</span><span>여권 잔여기간·입국카드·귀국 항공권 확인서</span></div>']:[];
 const items=TL.concat(KR_EXTRA).sort((a,b)=>b.d-a.d);
 let html=head+'<div style="margin-top:8px">';
 items.forEach(it=>{
  const stat=diff<it.d?'tl-done':(diff===it.d?'tl-now':'tl-wait');
  const mark=diff<it.d?'✅':(diff===it.d?'🔴':'⬜');
  html+='<div class="tl-item '+stat+'"><span class="tl-d">D-'+it.d+'</span><span class="tl-t">'+mark+' '+it.t+'</span><span style="color:#666;font-size:12.5px">'+it.x+'</span></div>';
 });
 html+='</div><div class="tip">💡 여권 잔여기간은 출발일 기준 6개월 이상이어야 합니다. 해외여행은 출발 3개월 전부터 준비를 시작하세요.</div>';
 out.innerHTML=html;
}
document.getElementById('dd-date').valueAsDate=new Date(Date.now()+14*864e5);
document.getElementById('dd-date').addEventListener('input',render);
document.getElementById('dd-dest').addEventListener('change',render);
render();
</script></main>
