<main><div class="meta">여행 도구 · 2026-11-24</div><h1>여행 코스 생성기 — 지역·인원·여행 스타일별 맞춤 일정</h1><p>지역·인원·여행 스타일·기간을 선택하면 <strong>세계 100개 도시</strong>의 실제 명소 데이터를 바탕으로 일차별 코스를 자동 생성합니다. 아이 동반 여부와 스타일에 따라 하루 코스 밀도와 명소 우선순위가 달라집니다.</p>

<script>
const KW={
 family:['공원','박물관','해변','시장','수족관','동물원','정원','탑',' 전망대'],
 culture:['박물관','궁','사원','교회','성','유적','미술관','대성당','기념관','박물관'],
 food:['시장','거리','골목','먹자골목','포장마차'],
 relax:['해변','공원','호수','정원','섬','리조트','온천','스파'],
 activity:['타워','케이블카','스키','서핑','다리','놀이공원',' 전망','폭포','트레킹','하이킹']
};
const DSTYLE={
 family:{per:2,note:'아이와 함께라 하루 2곳 중심으로 여유롭게 배치했습니다.'},
 culture:{per:4,note:'역사·문화 명소 위주로 하루 코스를 빡빡하게 구성했습니다.'},
 food:{per:3,note:'미식·시장 코스를 끼워 넣어 하루 3곳 + 먹거리 중심입니다.'},
 relax:{per:2,note:'휴양 스타일 — 하루 2곳 + 여유 시간 배치입니다.'},
 activity:{per:3,note:'액티비티·체험 명소를 우선 배치했습니다.'}
};
const sel=document.getElementById('tp-city');
const conts=[...new Set(TRIP_CITIES.map(c=>c.ct))];
conts.forEach(ct=>{
 const g=document.createElement('optgroup');g.label=ct;
 TRIP_CITIES.filter(c=>c.ct===ct).forEach(c=>{
  const o=document.createElement('option');o.value=c.n;o.textContent=c.n+' ('+c.en+')';g.appendChild(o);});
 sel.appendChild(g);});
const dl=document.getElementById('tp-cty');
TRIP_CITIES.forEach(c=>{const o=document.createElement('option');o.value=c.n;dl.appendChild(o)});
const KWE={
 family:['park','museum','beach','market','zoo','garden','tower','aquarium','playground'],
 culture:['museum','church','cathedral','castle','palace','temple','shrine','monument','gallery','heritage'],
 food:['market','street','food','culinary','bazaar','night market'],
 relax:['beach','park','lake','garden','island','spa','hot spring','resort','waterfall'],
 activity:['tower','view','bridge','ski','surf','theme park','waterfall','trail','hike','cable']
};
const BADRX=/rebellion|incident|siege|battle|war\b|treaty|earthquake|plague|riot|massacre|coup|invasion|sack of|destruction|accident|disaster|flood|eruption|storm|crash|assassinat|scandal|election|protest|strike\b|census|population|demograph|geograph|economy of|history of|station|terminus|depot|airport|seaport|\bport\b|railway|railroad|metro|subway|tram|bus\b|highway|interchange|junction|district|neighborhood|quarter|ward\b|line\b|route\b/i;
const GOODRX=/temple|shrine|castle|palace|museum|gallery|park\b|garden|tower|pagoda|church|cathedral|mosque|monument|memorial|historic|heritage|unesco|world heritage|landmark|market|bazaar|festival|bridge|viewpoint|observatory|library|theat|opera|arena|stadium|zoo|aquarium|botanical|onsen|hot spring|beach|island|lake|waterfall|canyon|cave|cliff|mountain|volcano|desert|forest\b|national park|ski|surf|theme park|amusement|fort|ruins|archaeolog|abbey|monastery|basilica|stupa|torii|sanctuary|former|oldest|largest|tallest|famous|iconic|masterpiece|architect/i;
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-')}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function rank(sights,style,kids){
 const kws=KW[style]||[];
 return sights.map((s,i)=>{
  let sc=0;const t=s[0]+(s[1]||'');
  kws.forEach((k,j)=>{if(t.includes(k))sc+=10-j});
  if(kids>0&&/어린이|체험|공원|박물관|수족관|동물원/.test(t))sc+=6;
  return {s,i,sc};
 }).sort((a,b)=>b.sc-a.sc||a.i-b.i).map(x=>x.s);
}
function goDB(){
 const c=TRIP_CITIES.find(x=>x.n===sel.value);if(!c)return;
 const A=+document.getElementById('tp-ad').value,K=+document.getElementById('tp-kd').value;
 const days=+document.getElementById('tp-days').value,style=document.getElementById('tp-style').value;
 const ds=DSTYLE[style];let per=ds.per;
 if(A+K>=5)per=Math.max(2,per-1);
 if(days===1)per=Math.min(per+1,5);
 const sights=rank(c.s.slice(),style,K);
 if(!sights.length){document.getElementById('tp-out').innerHTML='<p style="color:#888">이 도시의 명소 데이터가 부족합니다.</p>';return}
 const need=days*per;
 const cyc=[];for(let i=0;i<need;i++)cyc.push(sights[i%sights.length]);
 const foods=c.f||[];
 let html='<div style="margin-top:22px">'
  +'<div style="background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px">'
  +'<div style="font-size:20px;font-weight:800">'+esc(c.n)+' ('+esc(c.en)+') '+days+'일 코스</div>'
  +'<div style="font-size:13px;opacity:.9;margin-top:4px">성인 '+A+'명'+(K?' · 소아 '+K+'명':'')+' · '+document.getElementById('tp-style').selectedOptions[0].textContent+' · '+ds.note+'</div></div>';
 for(let d=0;d<days;d++){
  const items=cyc.slice(d*per,(d+1)*per);
  html+='<div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:16px 18px;margin-bottom:12px">'
   +'<div style="font-size:15px;font-weight:800;color:#0f766e;margin-bottom:10px">DAY '+(d+1)+(days===1?' · 당일치기':'')+'</div>';
  const isKR=c.co==='한국',cslug=slugify(c.en);
  items.forEach((s,j)=>{
   const slot=j===0?'☀️ 오전':(j===1?'🌤️ 오후':'🌆 오후 늦게');
   const q=encodeURIComponent(s[0]+' '+c.n);
   let detUrl='';
   if(s[2]&&/^\d+$/.test(s[2]))detUrl='/familytrip/korea/attr-'+s[2]+'.html';
   else if(s[3])detUrl='/familytrip/places/'+s[3]+'.html';
   if(detUrl){
    html+='<a href="'+detUrl+'" style="display:block;margin-bottom:10px;border:1px solid #99e5d8;border-radius:10px;padding:12px 14px;background:#f0fdfa;text-decoration:none">'
     +'<div style="font-size:14.5px;font-weight:700;color:#0f766e">'+slot+' — '+esc(s[0])+' <span style="font-size:11px;font-weight:400">▸ 상세 페이지로 이동 →</span></div>'
     +(s[1]?'<div style="font-size:12.5px;color:#444;line-height:1.7;margin-top:6px">'+esc(s[1])+'</div>':'')
     +'<div style="font-size:11.5px;color:#0f766e;font-weight:700;margin-top:8px">📋 소개·가는 법·운영시간·입장료·지도 보기 →</div></a>';return;}
   let det='<div style="font-size:12.5px;color:#444;line-height:1.7;margin:8px 0 0 4px">';
   if(s[1])det+='<p style="margin:0 0 8px">'+esc(s[1])+'</p>';
   det+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'
    +'<a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener" style="font-size:12px;background:#e8f5e9;color:#166534;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">🗺️ Google 지도</a>';
   if(isKR){
    det+='<a href="https://map.naver.com/v5/search/'+encodeURIComponent(s[0]+' '+c.n)+'" target="_blank" rel="noopener" style="font-size:12px;background:#e8f5e9;color:#166534;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">네이버 지도</a>'
       +'<a href="https://map.kakao.com/link/search/'+encodeURIComponent(s[0]+' '+c.n)+'" target="_blank" rel="noopener" style="font-size:12px;background:#e8f5e9;color:#166534;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">카카오맵</a>';
   }
   det+='</div>';
   det+='<a href="/familytrip/cities/'+cslug+'.html" style="font-size:12.5px;color:#0f766e;font-weight:700;text-decoration:none">도시 가이드에서 '+esc(s[0])+' 상세 보기 →</a><br>';
   det+='</div>';
   html+='<details style="margin-bottom:10px;border:1px solid #eee;border-radius:10px;padding:10px 14px;background:#fafafa">'
    +'<summary style="cursor:pointer;font-size:14.5px;font-weight:700;list-style:none">'+slot+' — '+esc(s[0])+' <span style="font-size:11px;color:#0f766e;font-weight:400">▸ 클릭하면 상세 정보</span></summary>'+det+'</details>';});
  if(c.mv)html+='<div style="font-size:12.5px;color:#666;margin:-2px 0 8px">🚇 도시 교통 팁: '+esc(c.mv)+'</div>';
  const fi=(d*2)%Math.max(foods.length,1);
  if(foods.length){
   html+='<div style="border-top:1px dashed #eee;margin-top:6px;padding-top:8px;font-size:13px;color:#92400e">'
    +'🍽️ 점심: '+esc(foods[fi][0])+'<br>🍷 저녁: '+esc(foods[(fi+1)%foods.length][0])+'</div>';}
  html+='</div>';}
 if(days>=4&&c.dt&&c.dt.length){
  html+='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px 18px;font-size:13.5px;margin-bottom:12px">'
   +'💡 '+days+'일 이상이면 당일치기로 <b>'+esc(c.dt[0].split('(')[0])+'</b>도 추천합니다 ('+esc(c.dt[0])+').</div>';}
 if(c.tips&&c.tips.length){
  html+='<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:14px 18px;font-size:13px;margin-bottom:12px">'
   +'<b>📌 '+esc(c.n)+' 팁</b><ul style="margin:6px 0 0 18px">'+c.tips.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>';}
 html+='<div style="display:flex;gap:10px;flex-wrap:wrap">'
  +'<a href="/familytrip/cities/'+slugify(c.en)+'.html" style="background:#0f766e;color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;text-decoration:none;font-size:14px">도시 가이드 보기 →</a>'
  +'<a href="https://www.rome2rio.com/s/'+encodeURIComponent('서울')+'/'+encodeURIComponent(c.en)+'" target="_blank" rel="noopener" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">🚄 서울→'+esc(c.n)+' 교통편 검색 →</a>'
  +'<a href="/familytrip/tools/family-cost-calculator.html" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">경비 계산기 →</a>'
  +'<a href="/familytrip/tools/packing-checklist.html" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">짐싸기 리스트 →</a></div></div>';
 document.getElementById('tp-out').innerHTML=html;
 document.getElementById('tp-out').scrollIntoView({behavior:'smooth'});
}
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function wikiOpS(lang,q){try{const d=await jget('https://'+lang+'.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(q)+'&limit=1&namespace=0&format=json&origin=*');return(d[1]&&d[1][0])||null}catch(e){return null}}
async function wikiSum(lang,title){try{const d=await jget('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_')));return{title:d.title||title,extract:(d.extract||'').trim(),img:(d.thumbnail&&d.thumbnail.source)||'',url:(d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page)||('https://'+lang+'.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_')))}}catch(e){return null}}
function hav(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function samplePoints(c){
 const pts=[[c.lat,c.lon]],bb=c.bbox;
 if(bb&&bb.length===4){const s=+bb[0],n=+bb[1],w=+bb[2],e=+bb[3];
  if(n-s>0.04||e-w>0.04){pts.push([(s+n)/2,w],[(s+n)/2,e],[s,(w+e)/2],[n,(w+e)/2]);
   if(n-s>0.12||e-w>0.12)pts.push([(s+n)/2,(w+e)/2]);}}
 return pts.slice(0,6);
}
async function fetchNearbyItems(c,self){

function rankCustom(items,style){

  rem.forEach((s,i)=>{if(typeof s.lat!=='number'||typeof s.lon!=='number')return;const d=hav(cur.lat,cur.lon,s.lat,s.lon);if(d<bd){bd=d;bi=i}});

  const st=prevEnd||{lat:r.lat,lon:r.lon};
  const ord=nnOrder(cyc.slice(d*per,(d+1)*per),st.lat,st.lon);
  dayItems.push(ord);
  const last=ord.filter(s=>typeof s.lat==='number'&&typeof s.lon==='number').pop();
  if(last)prevEnd={lat:last.lat,lon:last.lon};
 }
 for(let d=0;d<days;d++){
  const items=dayItems[d];
  html+='<div style="background:#fff;border:1px solid #eee;border-radius:12px;padding:16px 18px;margin-bottom:12px">'
   +'<div style="font-size:15px;font-weight:800;color:#0f766e;margin-bottom:10px">DAY '+(d+1)+(days===1?' · 당일치기':'')+'</div>';
  items.forEach((s,j)=>{
   const slot=j===0?'☀️ 오전':(j===1?'🌤️ 오후':'🌆 오후 늦게');
   const q=encodeURIComponent(s.name+' '+r.placeName);
   html+='<details style="margin-bottom:10px;border:1px solid #eee;border-radius:10px;padding:10px 14px;background:#fafafa">'
    +'<summary style="cursor:pointer;font-size:14.5px;font-weight:700;list-style:none">'+slot+' — '+esc(s.name)+' <span style="font-size:11px;color:#888;font-weight:400">'+(s.dist<1000?'':(s.dist/1000).toFixed(1)+'km · ')+'▸ 클릭하면 상세 정보</span></summary>'
    +'<div style="font-size:12.5px;color:#444;line-height:1.7;margin:8px 0 0 4px">'
    +(s.img?'<img src="'+s.img+'" loading="lazy" style="width:100%;max-height:190px;object-fit:cover;border-radius:8px;margin-bottom:8px" alt="'+esc(s.name)+'">':'')
    +(s.desc?'<p style="margin:0 0 8px">'+esc(s.desc)+'</p>':'')
    +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'
    +'<a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener" style="font-size:12px;background:#e8f5e9;color:#166534;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">🗺️ Google 지도</a>'
    +'<a href="'+s.url+'" target="_blank" rel="noopener" style="font-size:12px;background:#e8f5e9;color:#166534;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">📖 위키백과</a>'
    +'<a href="https://www.klook.com/search/result/?query='+encodeURIComponent(s.name+' '+r.placeName)+'" target="_blank" rel="noopener" style="font-size:12px;background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">🎫 예매·투어</a>'
    +(isKR?'<a href="https://map.naver.com/v5/search/'+encodeURIComponent(s.name+' '+r.placeName)+'" target="_blank" rel="noopener" style="font-size:12px;background:#e8f5e9;color:#166534;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600">네이버 지도</a>':'')
    +'</div></div></details>';});
  html+='</div>';}
 if(r.alts&&r.alts.length>1&&r.items.length<6){
  html+='<div style="background:#fff;border:1px solid #fde68a;border-radius:12px;padding:14px 18px;font-size:13px;margin-bottom:12px">🔍 명소 정보가 적습니다. 혹시 다른 지역을 찾으시나요? '
   +r.alts.map(a=>'<button class="tp-alt" data-q="'+esc(a.fullName)+'" style="margin:4px 4px 0 0;padding:6px 12px;border:1px solid #f59e0b;border-radius:16px;background:#fffbeb;color:#92400e;font-size:12.5px;cursor:pointer;font-weight:600">'+esc(a.placeName)+(a.n?' · '+a.n+'곳':'')+'</button>').join('')+'</div>';}
 html+='<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:14px 18px;font-size:13px;margin-bottom:12px">'
  +'<b>📌 '+esc(r.placeName)+' 팁</b><ul style="margin:6px 0 0 18px">'
  +'<li>위키백과·OpenStreetMap 기반 자동 생성 코스입니다 — 방문 전 구글맵에서 위치와 운영 여부를 확인하세요.</li>'
  +'<li>날씨는 위 지역 좌표 기준 실시간 예보입니다. 지도는 방문 동선 순서대로 번호가 매겨져 있습니다.</li></ul></div>';
 html+='<div style="display:flex;gap:10px;flex-wrap:wrap">'
  +'<a href="https://www.google.com/maps/dir/?api=1&destination='+r.lat+','+r.lon+'" target="_blank" rel="noopener" style="background:#0f766e;color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;text-decoration:none;font-size:14px">🧭 '+esc(r.placeName)+' 길찾기 →</a>'
  +(isKR?'<a href="/familytrip/live/korea-cctv.html" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">📹 실시간 CCTV →</a>':'')
  +'<a href="https://www.rome2rio.com/s/'+encodeURIComponent('서울')+'/'+encodeURIComponent(r.fullName||r.placeName)+'" target="_blank" rel="noopener" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">🚄 서울→'+esc(r.placeName)+' 교통편 검색 →</a>'
  +'<a href="https://www.google.com/search?q='+gq+'" target="_blank" rel="noopener" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">🔍 구글 여행 정보 검색 →</a>'
  +'<a href="/familytrip/tools/family-cost-calculator.html" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">경비 계산기 →</a>'
  +'<a href="/familytrip/tools/packing-checklist.html" style="background:#fff;border:1px solid #d1d5db;padding:10px 18px;border-radius:8px;font-weight:700;color:#374151;text-decoration:none;font-size:14px">짐싸기 리스트 →</a></div></div>';
 document.getElementById('tp-out').innerHTML=html;
 document.querySelectorAll('#tp-out .wx').forEach(el=>{if(window.mountWx)window.mountWx(el)});
 initMap(r,dayItems);
 loadMeta(r);
 document.querySelectorAll('.tp-alt').forEach(b=>{b.onclick=()=>{document.getElementById('tp-custom').value=b.dataset.q;go()}});
 document.getElementById('tp-out').scrollIntoView({behavior:'smooth'});
}
async function go(){
 const cq=(document.getElementById('tp-custom').value||'').trim();
 if(cq){
  const hit=TRIP_CITIES.find(x=>x.n===cq||x.en.toLowerCase()===cq.toLowerCase());
  if(hit){sel.value=hit.n;goDB();return}
  document.getElementById('tp-out').innerHTML='<div style="margin-top:22px;background:#f0fdfa;border:1px solid #99e5d8;border-radius:12px;padding:18px;font-size:14px;color:#0f766e">🌐 「'+esc(cq)+'」 위치와 주변 명소 정보를 검색하고 있습니다… (지역이 넓거나 후보가 여러 개면 20~30초 걸릴 수 있습니다)</div>';
  const r=await resolveCustom(cq);
  if(r.error){document.getElementById('tp-out').innerHTML='<div style="margin-top:22px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px 18px;color:#991b1b;font-size:14px">'+r.error+'</div>';return}
  await renderCustom(r);return;
 }
 goDB();
}
document.getElementById('tp-go').onclick=go;
