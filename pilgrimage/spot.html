<main><div class="meta">K-콘텐츠 순례 · 2026-11-25</div><h1>촬영지 상세 — 사진·추천 코스·CCTV·위키백과</h1><div id="sp" style="background:#f8fafc;border:1px solid #e6e2d8;border-radius:14px;padding:22px;margin:16px 0">

<p><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"></p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="spots.js"></script>
<script>
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hav(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const wikiCache={};
async function wikiInfo(name,region){
 const key=name+'|'+region;
 if(wikiCache[key]!==undefined)return wikiCache[key];
 const queries=[name,name+' '+region];
 for(const q of queries)for(const lang of['ko','en']){
  try{
   const s=await(await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(q)+'&limit=1&namespace=0&format=json&origin=*')).json();
   if(!s[1]||!s[1][0])continue;
   const title=s[1][0];
   const sum=await(await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_')))).json();
   if(sum&&sum.extract){const info={title:sum.title||title,extract:(sum.extract||'').slice(0,700),img:(sum.thumbnail&&sum.thumbnail.source)||'',url:(sum.content_urls&&sum.content_urls.desktop&&sum.content_urls.desktop.page)||''};wikiCache[key]=info;return info}
  }catch(e){}
 }
 wikiCache[key]=null;return null;
}
const REGION_TIPS={
'경주':'경주 시내는 대릉원·불국사·첨성대가 도보·버스 10분 내 밀집 — 렌터카 없이도 반나절 코스 가능. 양동마을은 시내에서 차로 20분.',
'강릉':'경포·주문진·강문해변·해동용궁사가 동해안 라인을 따라 30분 간격 — 렌터카 추천. 경포대는 일몰 무렵이 포토스팟.',
'제주':'협재·함덕(서쪽)과 성산·섭지코지(동쪽)가 반대편이라 하루에 다 보기 어렵습니다 — 동부/서부를 나눠 계획하세요. 렌터카 필수.',
'서울':'지하철+도보로 대부분 커버됩니다. 성수동·을지로·홍대는 저녁 시간대가 살아있고, 남산타워는 야경 추천.',
'여주':'남이섬은 여주 IC에서 버스 30분 or 택시 15분. 세종대왕릉은 남이섬에서 차로 10분 거리.',
'통영':'동피랑은 통영 시내 중심 — 버스로 이동 가능. 대포항·정거장 전망대와 묶으면 반나절 코스.',
'포항':'영일대해수욕장은 포항 시내에서 차로 10분. 형제해수욕장·호미곶 등 해안 라인 드라이브 추천.',
'전주':'한옥마을은 시내 중심 — 전주 한옥체험관·풍남문·객사와 묶으면 반나절. 전주비빔밥 필수.',
'안동':'하회마을은 안동 시내에서 차로 30분(버스 1시간). 도산서원·안동하회탈춤공연과 묶으면 당일치기 적합.'
};
function courseFor(spot,idx){
 const same=SPOTS.map((s,i)=>({s,i})).filter(x=>x.s.r===spot.r&&x.i!==idx).map(x=>({i:x.i,...x.s}));
 // 이 촬영지에서 가까운 순 정렬 (nearest neighbor)
 const out=[];let cur={lat:spot.lat,lon:spot.lon};
 const pool=same.slice();
 while(pool.length){
  let bi=0,bd=Infinity;
  pool.forEach((p,j)=>{const d=hav(cur.lat,cur.lon,p.lat,p.lon);if(d<bd){bd=d;bi=j}});
  const p=pool.splice(bi,1)[0];out.push({spot:p,dist:bd});cur={lat:p.lat,lon:p.lon};
 }
 return out;
}
function miniMap(spot){
 const near=SPOTS.map((s,i)=>({s,i})).filter(x=>x.i!==SPOTS.indexOf(spot)&&hav(spot.lat,spot.lon,x.s.lat,x.s.lon)<30000).slice(0,8);
 return near;
}
async function render(){
 const idx=parseInt(new URLSearchParams(location.search).get('s'),10);
 const out=document.getElementById('sp-out');
 if(isNaN(idx)||!SPOTS[idx]){out.innerHTML='<div class="err">촬영지를 찾을 수 없습니다. <a href="kdrama-filming-spots.html" style="color:#0f766e">← 목록으로</a></div>';return}
 const s=SPOTS[idx],col=FCOLORS[s.t]||'#0f766e';
 document.title=s.s+' — '+s.t+' 촬영지 | FamilyTrip';
 const info=await wikiInfo(s.s,s.r);
 const course=courseFor(s,idx);
 const near=miniMap(s);
 const tip=REGION_TIPS[s.r]||'';
 let h='<div class="hero">'
  +(info&&info.img?'<img src="'+info.img+'" alt="'+esc(s.s)+'">':'')
  +'<div class="cap"><h2>'+esc(s.s)+'</h2><div class="sub"><span class="badge">'+s.t+'</span><span class="badge">'+s.r+'</span><span class="badge">'+s.tag+'</span></div></div></div>'
  +'<div class="sec"><h3>🎬 촬영 정보</h3><div style="font-size:13.5px;color:#444;line-height:1.8">'+s.d+'</div>'
  +'<div style="font-size:11.5px;color:#999;margin-top:8px">※ 촬영지는 팬 확인 공개 정보 기준 — 세트·CG 장면일 수 있습니다.</div></div>';
 if(course.length){
  h+='<div class="sec"><h3>🗺️ '+s.r+' 촬영지 추천 코스 <span style="font-size:11.5px;color:#888;font-weight:400">— 이 장소에서 가까운 순 자동 정렬</span></h3><div class="course">'
   +'<div class="cstep"><div class="cnum">★</div><div class="cbody"><a href="spot.html?s='+idx+'">'+esc(s.s)+'</a><div class="cd">시작점 — '+s.t+'</div></div></div>'
   +course.slice(0,6).map((c,j)=>'<div class="cstep"><div class="cnum">'+(j+2)+'</div><div class="cbody"><a href="spot.html?s='+c.i+'">'+esc(c.s)+'</a><div class="cd">'+c.t+' · '+s.r+' · 약 '+(c.dist<1000?Math.round(c.dist)+'m':(c.dist/1000).toFixed(1)+'km')+'</div></div></div>').join('')
   +'</div><div style="font-size:11.5px;color:#888;margin-top:8px">총 '+course.length+'곳 · 차로 이동 기준 대략 소요 '+Math.round(course.reduce((a,c)=>a+c.dist,0)/1000*2+course.length*8)+'분 내외</div></div>';
 }
 h+='<div class="sec"><h3>🔗 방문 정보</h3><div class="links">'
  +'<a class="l-g" href="https://www.google.com/maps/search/?api=1&query='+s.lat+','+s.lon+'" target="_blank" rel="noopener">🗺️ Google 지도</a>'
  +'<a class="l-n" href="https://map.naver.com/v5/search/'+encodeURIComponent(s.s+' '+s.r)+'" target="_blank" rel="noopener">네이버 지도</a>'
  +'<a class="l-t" href="/familytrip/tools/trip-planner.html" style="font-size:12.5px;padding:7px 14px;border-radius:16px;text-decoration:none;font-weight:600;background:#f0fdfa;color:#0f766e">🗺️ '+s.r+' 여행 코스 생성 →</a>'
  +'<a class="l-c" href="/familytrip/live/tourist-live.html" style="font-size:12.5px;padding:7px 14px;border-radius:16px;text-decoration:none;font-weight:600;background:#fef3c7;color:#92400e">📹 주변 실시간 CCTV →</a>'
  +(info&&info.url?'<a class="l-w" href="'+info.url+'" target="_blank" rel="noopener">📖 위키백과 상세 →</a>':'')
  +'</div></div>';
 if(info){
  h+='<div class="sec"><h3>📖 '+esc(info.title)+'</h3>'
   +(info.img?'<img src="'+info.img+'" loading="lazy" style="width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-bottom:10px" alt="'+esc(s.s)+'">':'')
   +'<div style="font-size:13px;color:#444;line-height:1.8">'+esc(info.extract)+'</div>'
   +'<div class="wiki-src">출처: <a href="'+info.url+'" target="_blank" rel="noopener" style="color:#0f766e">'+esc(info.title)+' — 위키백과</a></div></div>';
 }
 if(tip)h+='<div class="sec"><h3>💡 '+s.r+' 방문 팁</h3><div class="tip">'+tip+'</div></div>';
 if(near.length){
  h+='<div class="sec"><h3>📍 주변 촬영지 <span style="font-size:11.5px;color:#888;font-weight:400">— 30km 이내</span></h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">'
   +near.map(x=>'<a href="spot.html?s='+x.i+'" style="display:block;background:#f8fafc;border:1px solid #eee;border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit"><div style="font-size:13px;font-weight:700;color:#0f766e">'+esc(x.s.s)+'</div><div style="font-size:11.5px;color:#888;margin-top:2px">'+x.s.t+' · '+x.s.r+'</div></a>').join('')
   +'</div></div>';
 }
 h+='<div class="sec"><h3>🗺️ 위치</h3><div id="sp-map" class="mini-map"></div></div>'
  +'<div style="margin-top:6px"><a href="kdrama-filming-spots.html" style="color:#0f766e;font-weight:700;text-decoration:none;font-size:13px">← 촬영지 목록으로 돌아가기</a></div>';
 out.innerHTML=h;
 // 지도
 const map=L.map('sp-map').setView([s.lat,s.lon],13);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap · © CARTO',maxZoom:19}).addTo(map);
 L.circleMarker([s.lat,s.lon],{radius:10,color:'#fff',weight:3,fillColor:col,fillOpacity:1}).addTo(map).bindPopup('<b>'+esc(s.s)+'</b>');
 near.forEach(x=>{L.circleMarker([x.s.lat,x.s.lon],{radius:6,color:'#fff',weight:2,fillColor:'#94a3b8',fillOpacity:.9}).addTo(map).bindPopup(esc(x.s.s))});
 out.scrollIntoView({behavior:'smooth'});
}
render();
</script></main>
