<p id="sp-empty" style="display:none;color:#888">검색 결과가 없습니다.</p>
<script>
(function(){
const q=document.getElementById('sp-q');
function filt(){
 const v=q.value.trim().toLowerCase();let vis=0;
 document.querySelectorAll('.spot-card').forEach(c=>{
  const on=!v||c.dataset.name.includes(v);c.style.display=on?'':'none';if(on)vis++;
 });
 document.getElementById('sp-empty').style.display=vis?'none':'block';
}
q.addEventListener('input',filt);
})();
</script>
