<script>
(function(){
const q=document.getElementById('sp-q');
function filt(){
 const v=q.value.trim().toLowerCase();let vis=0;

 });
 document.getElementById('sp-empty').style.display=vis?'none':'block';
}
q.addEventListener('input',filt);
})();
