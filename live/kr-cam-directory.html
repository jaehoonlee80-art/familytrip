<main>
<h1>📷 한국 실시간 카메라 디렉토리</h1>
<p class="sub">공공기관 카메라 <strong id="total">190</strong>곳 — 마커를 클릭하면 바로 실시간 화면이 열립니다.</p>

</div>

<div id="lmodal"><div class="lm-card">
  <div class="lm-hd"><span class="nm" id="lm-name"></span><span class="meta" id="lm-meta"></span><span class="sp"></span>
    <a id="lm-official" href="#" target="_blank" rel="noopener">공식 페이지 ↗</a>
    <button class="lm-x" id="lm-x">✕</button></div>
  <div class="lm-bd" id="lm-bd"></div>

</div></div>

<script>
const PROXY='https://jeju-cctv-proxy.jaehoonlee80.workers.dev';
const KF='https://coast.mof.go.kr/serviceGateway.jsp?'+encodeURIComponent('http://10.176.62.134:9001/tilemapApi.do?url=');
const KF_IMG=u=>KF+encodeURIComponent('http://220.95.232.18:8080/img/'+u+'_0.jpg');
const SNAP='cams/';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const TABS=[
 {id:'all',label:'전체',test:()=>true},
 {id:'jeju',label:'제주',test:c=>c.region_id==='jeju'||['jejusi-wave','jeju-danger','seogwipo','hallasan'].includes(c.src)},
 {id:'mountain',label:'산·등산',test:c=>c.cats.some(x=>['mountain','national-park','hiking'].includes(x))},
 {id:'coast',label:'해안·바다',test:c=>c.cats.some(x=>['coast','beach'].includes(x))},
 {id:'river',label:'하천·강',test:c=>c.cats.includes('river')},
 {id:'city',label:'도시·기타',test:c=>!['jeju','mountain','coast','river'].some(t=>TABS.find(x=>x.id===t).test(c))||c.cats.includes('city')},
];
let CAMS=[],MAP,MARKERS={},KBS={};
const CAT_COLOR={jeju:'#0f766e',mountain:'#7c3aed',coast:'#0284c7',river:'#65a30d',city:'#dc2626'};
function camColor(c){
 if(c.region_id==='jeju'||['jejusi-wave','jeju-danger','seogwipo','hallasan'].includes(c.src))return CAT_COLOR.jeju;
 if(c.cats.some(x=>['mountain','national-park','hiking'].includes(x)))return CAT_COLOR.mountain;
 if(c.cats.some(x=>['coast','beach'].includes(x)))return CAT_COLOR.coast;
 if(c.cats.includes('river'))return CAT_COLOR.river;
 return CAT_COLOR.city;
}
function tabsHTML(){
 document.getElementById('tabs').innerHTML=TABS.map(t=>'<button data-t="'+t.id+'" class="'+(t.id==='all'?'on':'')+'">'+t.label+'</button>').join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  render(b.dataset.t);
 });
}
function inTab(c,tid){return TABS.find(t=>t.id===tid).test(c);}
function cardHTML(c){
 const tags=c.cats.slice(0,3).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
 return '<div class="camcard" onclick="showCam(\''+c.id+'\')">'
 +'<div class="nm">'+esc(c.short)+'</div>'
 +'<div class="meta">'+esc(c.region)+(c.approx?' · 위치 추정':'')+' '+tags+'</div>'
 +'<div class="ft"><span>'+esc(c.source||'')+'</span><span class="go">▶ 실시간</span></div></div>';
}
function render(tid){
 const list=CAMS.filter(c=>inTab(c,tid));
 document.getElementById('mapcount').textContent='표시 중 '+list.length+'개';
 document.getElementById('gridcount').textContent=list.length+'개 카메라';
 document.getElementById('grid').innerHTML=list.map(cardHTML).join('');
 Object.values(MARKERS).forEach(m=>MAP.removeLayer(m));MARKERS={};
 list.forEach(c=>{
  const m=L.circleMarker([c.lat,c.lon],{radius:8,color:'#fff',weight:1.5,fillColor:camColor(c),fillOpacity:.92}).addTo(MAP);
  m.bindPopup('<div style="min-width:150px"><b>'+esc(c.short)+'</b><br><span style="color:#666;font-size:11px">'+esc(c.region)+(c.approx?' · 위치 추정':'')+'</span><br><a href="javascript:void(0)" onclick="showCam(\''+c.id+'\');return false;" style="color:#0284c7;font-weight:700">▶ 실시간 보기</a></div>',{closeButton:false});
  m.on('click',()=>showCam(c.id));
  MARKERS[c.id]=m;
 });
 if(list.length&&tid!=='all'){const g=L.latLngBounds(list.map(c=>[c.lat,c.lon]));MAP.fitBounds(g.pad(0.15));}
}
// ── 카메라 뷰어 ──
function showCam(id){
 const c=CAMS.find(x=>x.id===id);if(!c)return;
 document.getElementById('lm-name').textContent=c.short;
 document.getElementById('lm-meta').textContent=c.region+(c.approx?' · 위치 추정':'');
 document.getElementById('lm-official').href=c.official;
 document.getElementById('lm-src').textContent=c.source||'';
 document.getElementById('lm-note').textContent='';
 const bd=document.getElementById('lm-bd');
 bd.innerHTML='<div class="ph">불러오는 중…</div>';
 document.getElementById('lmodal').classList.add('open');
 const card={dataset:{id:c.id},querySelector:sel=>bd.querySelector(sel)};
 mount(card);
}
function closeModal(){
 document.getElementById('lmodal').classList.remove('open');
 try{if(window._wrpc){window._wrpc.Stop&&window._wrpc.Stop();window._wrpc.Terminate&&window._wrpc.Terminate();window._wrpc=null;}}catch(_){}
 document.querySelectorAll('#lm-bd video').forEach(v=>{try{v.pause();}catch(_){} try{if(v._hls){v._hls.destroy();v._hls=null;}}catch(_){} try{v.removeAttribute('src');v.load();}catch(_){}});
 document.getElementById('lm-bd').innerHTML='';
}
document.getElementById('lm-x').onclick=closeModal;
document.getElementById('lmodal').onclick=e=>{if(e.target.id==='lmodal')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
// ── embed ──
function mount(card){
 const c=CAMS.find(x=>x.id===card.dataset.id);if(!c)return;
 const bd=document.getElementById('lm-bd');
 switch(c.embed){
  case 'hls': bd.innerHTML='<video muted playsinline autoplay></video>'; playHls(bd.querySelector('video'),c.hls); break;
  case 'proxy': bd.innerHTML='<video muted playsinline autoplay></video><div class="ph" style="position:absolute;inset:0;display:none">연결 중…</div>'; startProxy(c,bd.querySelector('video')); break;
  case 'webrtc': startWebrtc(c,bd); break;
  case 'snap': bd.innerHTML='<img loading="lazy" src="'+KF_IMG(c.code)+'" alt="'+esc(c.short)+'">'; snapRefresh(bd.querySelector('img'),()=>KF_IMG(c.code),20000); break;
  case 'kbs': bd.innerHTML='<div class="ph">불러오는 중…</div>'; startKbs(c,bd); break;
  case 'snapjob': bd.innerHTML='<img loading="lazy" src="'+SNAP+c.snap+'" alt="'+esc(c.short)+'"><div class="lm-snap">5분 스냅샷</div>';{const im=bd.querySelector('img');im.onerror=()=>{if(im.dataset.dead)return;im.dataset.dead=1;bd.innerHTML='<div class="ph"><a href="'+c.official+'" target="_blank" rel="noopener">스냅샷 준비 중 — 공식 페이지에서 보기 ↗</a></div>';};} snapRefresh(bd.querySelector('img'),()=>SNAP+c.snap+'?t='+Date.now(),60000); break;
  default: bd.innerHTML='<div class="ph"><a href="'+c.official+'" target="_blank" rel="noopener">공식 페이지에서 실시간 화면 보기 ↗</a></div>';
 }
}
function snapRefresh(img,urlFn,ms){
 if(!img)return;
 img.onerror=()=>{img.style.opacity=.35;};
 setInterval(()=>{if(!img.isConnected)return;const u=urlFn();const t=new Image();t.onload=()=>{if(img.isConnected)img.src=u;};t.src=u;},ms);
}
function playHls(video,url){
 if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;return;}
 if(window.Hls&&Hls.isSupported()){const h=new Hls({maxBufferLength:8});h.loadSource(url);h.attachMedia(video);video._hls=h;return;}
 video.parentElement.insertAdjacentHTML('beforeend','<div class="ph">이 브라우저는 HLS를 지원하지 않습니다</div>');
}
async function startProxy(c,video){
 try{
  const r=await fetch(PROXY+'/jejusi?cam='+c.cam);
  const j=await r.json();
  if(!j.url)throw 0;
  const purl=PROXY+'/?url='+encodeURIComponent(j.url);
  playHls(video,purl);
  setTimeout(()=>{if(video.isConnected)startProxy(c,video);},50*60*1000);
 }catch(e){const ph=video.parentElement.querySelector('.ph');if(ph)ph.style.display='flex';}
}
async function startKbs(c,bd){
 try{
  if(!Object.keys(KBS).length){
   const r=await fetch('kbs-cams.json');KBS={};(await r.json()).forEach(k=>KBS[k.id]=k);
  }
  const k=KBS[c.sid];
  if(k&&k.img){bd.innerHTML='<img src="'+k.img+'" alt="'+esc(c.short)+'">';snapRefresh(bd.querySelector('img'),()=>KBS[c.sid]?KBS[c.sid].img:k.img,90000);}
  else bd.innerHTML='<div class="ph"><a href="'+c.official+'" target="_blank" rel="noopener">공식 페이지에서 보기 ↗</a></div>';
 }catch(e){bd.innerHTML='<div class="ph">KBS 목록 로드 실패</div>';}
}
// KNPS 플레이어는 연결 실패 시 alert()를 500ms마다 무한 반복 → alert 무력화
window.alert=()=>{};
function startWebrtc(c,bd){
 bd.innerHTML='<video id="wv-'+c.id+'" autoplay muted playsinline style="width:100%;max-height:68vh;object-fit:contain;background:#000"></video><div class="ph" style="position:absolute;inset:0">연결 중…</div>';
 const done=()=>{const ph=bd.querySelector('.ph');if(ph)ph.remove();};
 if(!window.UnrealWebRTCPlayer){
  const s1=document.createElement('script');s1.src='https://live.knps.or.kr/play/rtc/webrtcadapter.js';
  s1.onload=()=>{const s2=document.createElement('script');s2.src='https://live.knps.or.kr/play/rtc/unrealwebrtcplayer_knps.js';s2.onload=()=>initWrtc(c,bd,done);document.head.appendChild(s2);};
  document.head.appendChild(s1);
 }else initWrtc(c,bd,done);
}
function initWrtc(c,bd,done){
 try{
  const p=new UnrealWebRTCPlayer('wv-'+c.id,c.alias,'','live.knps.or.kr','448',true,true,'tcp');
  window._wrpc=p;
  p.Play();
  const vid=document.getElementById('wv-'+c.id);
  let ok=false;
  const check=()=>{if(vid&&vid.videoWidth>0)ok=true;};
  vid&&vid.addEventListener('playing',check,{once:true});
  setTimeout(()=>{
   check();
   if(ok){done();return;}
   try{p.Stop&&p.Stop();p.Terminate&&p.Terminate();}catch(_){}
   bd.innerHTML='<div class="ph"><a href="'+c.official+'" target="_blank" rel="noopener">실시간 연결 실패 — 공식 페이지에서 보기 ↗</a></div>';
  },15000);
 }catch(e){const ph=bd.querySelector('.ph');if(ph)ph.textContent='연결 실패';}
}
// ── boot ──
fetch('kr-cams.json').then(r=>r.json()).then(cams=>{
 CAMS=cams;
 document.getElementById('total').textContent=cams.length;
 MAP=L.map('map',{scrollWheelZoom:true}).setView([36.4,127.9],7);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles © Esri — Source: Esri, DeLorme, NAVTEQ, USGS, NPS',maxZoom:19}).addTo(MAP);
 tabsHTML();render('all');
});
</script></main>
