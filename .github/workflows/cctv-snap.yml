name: cctv-snap
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: cctv-snap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Capture CCTV frames
        run: python3 .github/scripts/cctv_snap.py
      - name: Refresh KBS cam tokens
        run: python3 .github/scripts/kbs_cams.py
      - name: Commit updated snapshots
        run: |
          git config user.name "cctv-snap[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/cams live/kbs-cams.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update CCTV snapshots $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
