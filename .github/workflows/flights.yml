name: flights
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: flights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch flight status
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 .github/scripts/flights.py
      - name: Commit updated flights
        run: |
          git config user.name "flights-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea/flights.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update flight status $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
